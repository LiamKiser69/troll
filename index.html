<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random 8-Digit Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        #number {
            font-size: 2em;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Random 8-Digit Number Generator</h1>
    <p id="number">Generating...</p>
    <script>
        function generateNumber() {
            let randomNumber = Math.floor(10000000 + Math.random() * 90000000);
            document.getElementById("number").textContent = randomNumber;
        }
        generateNumber(); // Initial generation
        setInterval(generateNumber, 150000); // Every 2.5 minutes
    </script>
</body>
</html>

<!-- API endpoint -->
<script>
    const express = require('express');
    const app = express();
    const port = 3000;

    app.get('/random-number', (req, res) => {
        const randomNumber = Math.floor(10000000 + Math.random() * 90000000);
        res.send(randomNumber.toString());
    });

    app.listen(port, () => {
        console.log(`Server running at http://localhost:${port}`);
    });
</script>
